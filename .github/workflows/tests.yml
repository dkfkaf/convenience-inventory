name: Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prerequisites:
    name: Check backend prerequisites
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.requirements.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check backend requirements
        id: requirements
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'backend/requirements.txt' -PathType Leaf) {
            'ready=true' >> $env:GITHUB_OUTPUT
          } else {
            'ready=false' >> $env:GITHUB_OUTPUT
            Write-Output '::notice::pytest skipped: backend/requirements.txt is missing (T001).'
            'pytest skipped: `backend/requirements.txt` is missing (T001).' >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Report current test scope
        if: steps.requirements.outputs.ready == 'true'
        run: echo 'Only the T003 database connection test runs. Full pytest waits for T009, T013, and T014.' >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: T003 · 테스트 DB 연결
    needs: prerequisites
    if: ${{ needs.prerequisites.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          # Credentials are only used by this disposable CI database.
          MYSQL_ROOT_PASSWORD: ci-root-local-only
          MYSQL_DATABASE: convenience_inventory_test
          MYSQL_USER: inventory_ci
          MYSQL_PASSWORD: ci-test-local-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --protocol=TCP --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INVENTORY_DB_HOST: 127.0.0.1
      INVENTORY_DB_USER: inventory_ci
      INVENTORY_DB_PASSWORD: ci-test-local-only
      INVENTORY_DB_NAME: convenience_inventory_demo
      INVENTORY_TEST_DB_NAME: convenience_inventory_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt -r test/requirements-dev.txt
      - name: Run T003 connection test
        env:
          INVENTORY_DB_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: python -m pytest -v test/test_environment.py
